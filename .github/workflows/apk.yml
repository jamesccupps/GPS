name: Build Android APK

# The APK is built here rather than locally because Java NIO cannot create a
# Selector on the dev machine: sun.nio.ch.PipeImpl's self-connection fails with
# "SocketException: Invalid argument: connect" out of UnixDomainSockets.connect0,
# so every Gradle build dies with "Unable to establish loopback connection"
# before it compiles anything. That is an OS/security-layer problem on that
# machine, not a project problem, and a clean runner sidesteps it entirely.
#
# Ships the UNLOCKED build on purpose: the lock exists because a Pages site is
# public, and a sideloaded APK on your own phone is not. See native/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'field-map-repo/field-map/native/**'
      - 'field-map-repo/field-map/src/**'
      - 'field-map-repo/field-map/data/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write        # needed to publish the rolling release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field-map-repo/field-map/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'          # Capacitor 7 requires >=20; 8 would need 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # Gradle 8.11 does not support JDK 24+

      - uses: android-actions/setup-android@v3

      - name: Install the Capacitor toolchain
        run: npm ci

      - name: Assemble www/ from the web build
        run: python3 scripts/assemble.py --build

      - name: Sync the native project
        run: npx cap sync android

      # AAPT's failure for a malformed resource is "exit code 1" with the detail
      # only in the log, which needs a sign-in to read. An unescaped "--" inside
      # an XML comment cost a full build round-trip once; this catches that class
      # in a second, before Gradle starts.
      - name: Check the Android resources are well-formed XML
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          bad = 0
          for f in sorted(Path('android/app/src/main').rglob('*.xml')):
              try:
                  ET.parse(f)
              except Exception as e:
                  print(f'INVALID {f}: {e}'); bad += 1
          print(f'{bad} invalid')
          sys.exit(1 if bad else 0)
          PY

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: field-map-repo/field-map/native/android

      - name: Report what was built
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "size: $(( $(stat -c%s "$APK") / 1024 )) KB"
          unzip -l "$APK" | grep -E "assets/public/(index.html|native.js)|classes.dex" || true

      - uses: actions/upload-artifact@v4
        with:
          name: field-map-debug-apk
          path: field-map-repo/field-map/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # A rolling release, so the phone has one permanent link to tap instead of
      # a per-run artifact that arrives as a zip and expires in thirty days:
      #   https://github.com/jamesccupps/GPS/releases/latest/download/field-map.apk
      # A rolling release, so the phone has one permanent link to tap instead of
      # a per-run artifact that arrives as a zip and expires in thirty days:
      #   https://github.com/jamesccupps/GPS/releases/latest/download/field-map.apk
      - name: Publish the APK to a rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk field-map.apk
          {
            echo "Debug-signed and sideloadable. Rebuilt on every push to main;"
            echo "this link always points at the newest build."
            echo
            echo "Install: tap field-map.apk below, then allow installs from your"
            echo "browser if Android asks."
            echo
            echo "Contains the unlocked parcel, like every build that is not the"
            echo "locked copy published to Pages."
            echo
            echo "Built from ${GITHUB_SHA}"
          } > notes.md
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Field Map - latest APK" --notes-file notes.md
          else
            gh release edit apk-latest --notes-file notes.md
          fi
          gh release upload apk-latest field-map.apk --clobber
