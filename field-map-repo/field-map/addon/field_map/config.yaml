name: Field Map
version: "1.0.0"
slug: field_map
description: Offline parcel field map with GPS marking, served behind Home Assistant auth
url: https://github.com/jamesccupps
arch:
  - aarch64
  - amd64
  - armv7
init: false
# Ingress puts this behind Home Assistant's own login — unlike /local/, which is
# served to anyone who knows the URL. Also means it works over Nabu Casa with no
# port forwarding and no extra tunnel.
ingress: true
ingress_port: 8099
panel_icon: mdi:map-marker-path
panel_title: Field Map
# no ports: block -> not reachable except through HA
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
